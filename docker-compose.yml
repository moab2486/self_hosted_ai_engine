services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    volumes:
      - ollama-data:/root/.ollama

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 1h

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-provisioner:
    image: ollama/ollama:latest
    container_name: ollama-provisioner-service
    volumes:
      - ollama-data:/root/.ollama
      - ./docker/Modelfile:/docker/Modelfile:ro
      - ./docker/ollama-pull-model.sh:/docker/ollama-pull-model.sh:ro
    
    depends_on:
      ollama:
        condition: service_healthy
    
    entrypoint: ["/bin/sh", "-c", "/docker/ollama-pull-model.sh"]

volumes:
  ollama-data: